name: vtuber-karaoke-search-dev

services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    volumes:
      - .:/workspace:cached
      # Keep Linux dependencies out of the Windows bind mount.
      - frontend-node-modules:/workspace/frontend/node_modules
    environment:
      APP_ENV: dev
      # Opening the development workspace must not start scraping implicitly.
      BACKGROUND_UPDATER_ENABLED: ${BACKGROUND_UPDATER_ENABLED:-false}
      MANAGEMENT_API_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_COOKIE_SECURE: "false"
      GUEST_RATE_LIMIT_ENABLED: ${GUEST_RATE_LIMIT_ENABLED:-true}
      GUEST_RATE_LIMIT_REQUESTS: ${GUEST_RATE_LIMIT_REQUESTS:-60}
      GUEST_RATE_LIMIT_WINDOW_SECONDS: ${GUEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_REQUESTS: ${LOGIN_RATE_LIMIT_REQUESTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      CHANNEL_ADD_COOLDOWN_SECONDS: ${CHANNEL_ADD_COOLDOWN_SECONDS:-10}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vks_db
      DB_USER: vks_db_user
      DB_PASSWORD: vks_db_pwd
      DATABASE_URL: postgresql+asyncpg://vks_db_user:vks_db_pwd@db:5432/vks_db
      DATA_UPDATE_INTERVAL: ${DATA_UPDATE_INTERVAL:-300}
      UPDATE_STEADY_SCAN_INTERVAL: ${UPDATE_STEADY_SCAN_INTERVAL:-21600}
      UPDATE_STEADY_RETRY_BASE: ${UPDATE_STEADY_RETRY_BASE:-900}
      UPDATE_STEADY_CHANNELS_PER_CYCLE: ${UPDATE_STEADY_CHANNELS_PER_CYCLE:-3}
      UPDATE_MAX_VIDEOS: ${UPDATE_MAX_VIDEOS:-40}
      UPDATE_MAX_METADATA_SCRAPES: ${UPDATE_MAX_METADATA_SCRAPES:-10}
      UPDATE_BACKFILL_PAGE_SIZE: ${UPDATE_BACKFILL_PAGE_SIZE:-100}
      UPDATE_BACKFILL_PAGES_PER_CYCLE: ${UPDATE_BACKFILL_PAGES_PER_CYCLE:-3}
      UPDATE_BACKFILL_CHANNELS_PER_CYCLE: ${UPDATE_BACKFILL_CHANNELS_PER_CYCLE:-1}
      UPDATE_LIST_SLEEP_MIN: ${UPDATE_LIST_SLEEP_MIN:-3}
      UPDATE_LIST_SLEEP_MAX: ${UPDATE_LIST_SLEEP_MAX:-7}
      UPDATE_MAX_COMMENT_SCRAPES: ${UPDATE_MAX_COMMENT_SCRAPES:-3}
      UPDATE_MAX_COMMENTS_PER_VIDEO: ${UPDATE_MAX_COMMENTS_PER_VIDEO:-50}
      UPDATE_MAX_ANALYZE_ATTEMPTS: ${UPDATE_MAX_ANALYZE_ATTEMPTS:-3}
      UPDATE_ANALYSIS_RECHECK_SECONDS: ${UPDATE_ANALYSIS_RECHECK_SECONDS:-86400}
      UPDATE_ANALYSIS_RETRY_BASE: ${UPDATE_ANALYSIS_RETRY_BASE:-1800}
      UPDATE_SCRAPE_SLEEP_MIN: ${UPDATE_SCRAPE_SLEEP_MIN:-20}
      UPDATE_SCRAPE_SLEEP_MAX: ${UPDATE_SCRAPE_SLEEP_MAX:-40}
      UPDATE_YOUTUBE_COOLDOWN_SECONDS: ${UPDATE_YOUTUBE_COOLDOWN_SECONDS:-21600}
      YTDLP_LIST_SLEEP_INTERVAL: ${YTDLP_LIST_SLEEP_INTERVAL:-1}
      YTDLP_LIST_MAX_SLEEP_INTERVAL: ${YTDLP_LIST_MAX_SLEEP_INTERVAL:-2}
      YTDLP_COMMENT_SLEEP_INTERVAL: ${YTDLP_COMMENT_SLEEP_INTERVAL:-2}
      YTDLP_COMMENT_MAX_SLEEP_INTERVAL: ${YTDLP_COMMENT_MAX_SLEEP_INTERVAL:-10}
      YTDLP_SOCKET_TIMEOUT_SECONDS: ${YTDLP_SOCKET_TIMEOUT_SECONDS:-30}
      YTDLP_RETRIES: ${YTDLP_RETRIES:-2}
      YTDLP_EXTRACTOR_RETRIES: ${YTDLP_EXTRACTOR_RETRIES:-2}
      YTDLP_OPERATION_TIMEOUT_SECONDS: ${YTDLP_OPERATION_TIMEOUT_SECONDS:-300}
      YTDLP_TERMINATE_GRACE_SECONDS: ${YTDLP_TERMINATE_GRACE_SECONDS:-5}
      UPDATER_SHUTDOWN_GRACE_SECONDS: ${UPDATER_SHUTDOWN_GRACE_SECONDS:-20}
      UPDATER_HEARTBEAT_INTERVAL_SECONDS: ${UPDATER_HEARTBEAT_INTERVAL_SECONDS:-30}
      UPDATER_HEARTBEAT_STALE_SECONDS: ${UPDATER_HEARTBEAT_STALE_SECONDS:-120}
      CACHE_URL: ${CACHE_URL:-}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-setlist-dev}
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-900}
      CACHE_SEARCH_TTL_SECONDS: ${CACHE_SEARCH_TTL_SECONDS:-900}
      CACHE_CATALOG_TTL_SECONDS: ${CACHE_CATALOG_TTL_SECONDS:-3600}
      CACHE_REPORT_TTL_SECONDS: ${CACHE_REPORT_TTL_SECONDS:-300}
      CACHE_FAILURE_BACKOFF_SECONDS: ${CACHE_FAILURE_BACKOFF_SECONDS:-5}
      CACHE_CONNECT_TIMEOUT_SECONDS: ${CACHE_CONNECT_TIMEOUT_SECONDS:-1}
      CACHE_SOCKET_TIMEOUT_SECONDS: ${CACHE_SOCKET_TIMEOUT_SECONDS:-1}
      WATCHFILES_FORCE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - vks
    stop_grace_period: 30s

  cache:
    image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    profiles: ["cache"]
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "${CACHE_MAXMEMORY:-80mb}",
        "--maxmemory-policy",
        "${CACHE_MAXMEMORY_POLICY:-allkeys-lru}",
        "--maxmemory-clients",
        "${CACHE_MAXMEMORY_CLIENTS:-5%}",
      ]
    restart: unless-stopped
    networks:
      - vks
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: homelab/vtuber-karaoke-search-postgres:dev
    build:
      context: .
      dockerfile: db/Postgres.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      # Supports the documented local (non-Dev-Container) Python workflow.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: vks_db
      POSTGRES_USER: vks_db_user
      POSTGRES_PASSWORD: vks_db_pwd
    volumes:
      - vks-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vks_db_user -d vks_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vks

  flyway:
    image: homelab/vtuber-karaoke-search-migrations:dev
    build:
      context: .
      dockerfile: db/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://db:5432/vks_db
      - -user=vks_db_user
      - -password=vks_db_pwd
      - -locations=filesystem:/flyway/sql
      - -connectRetries=5
      - migrate
    networks:
      - vks

volumes:
  vks-pgdata:
  frontend-node-modules:

networks:
  vks:
