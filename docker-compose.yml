name: vtuber-karaoke-search

services:
  frontend:
    image: homelab/vtuber-karaoke-search-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-https://github.com/yutinglia/setlist}
        VITE_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
    ports:
      # Keep the loopback default. Set FRONTEND_BIND_ADDRESS to the host's
      # private LAN address only when the TLS reverse proxy runs elsewhere.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vks
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: homelab/vtuber-karaoke-search-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      BACKGROUND_UPDATER_ENABLED: ${BACKGROUND_UPDATER_ENABLED:-true}
      MANAGEMENT_API_ENABLED: ${MANAGEMENT_API_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      GUEST_RATE_LIMIT_ENABLED: ${GUEST_RATE_LIMIT_ENABLED:-true}
      GUEST_RATE_LIMIT_REQUESTS: ${GUEST_RATE_LIMIT_REQUESTS:-60}
      GUEST_RATE_LIMIT_WINDOW_SECONDS: ${GUEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_REQUESTS: ${LOGIN_RATE_LIMIT_REQUESTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-vks_db}
      DB_USER: ${DB_USER:-vks_db_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Leave empty to build a safely escaped URL from DB_*; explicit URLs win.
      DATABASE_URL: ${DATABASE_URL:-}
      DATA_UPDATE_INTERVAL: ${DATA_UPDATE_INTERVAL:-300}
      UPDATE_STEADY_SCAN_INTERVAL: ${UPDATE_STEADY_SCAN_INTERVAL:-21600}
      UPDATE_STEADY_RETRY_BASE: ${UPDATE_STEADY_RETRY_BASE:-900}
      UPDATE_STEADY_CHANNELS_PER_CYCLE: ${UPDATE_STEADY_CHANNELS_PER_CYCLE:-3}
      UPDATE_MAX_VIDEOS: ${UPDATE_MAX_VIDEOS:-40}
      UPDATE_MAX_METADATA_SCRAPES: ${UPDATE_MAX_METADATA_SCRAPES:-10}
      UPDATE_BACKFILL_PAGE_SIZE: ${UPDATE_BACKFILL_PAGE_SIZE:-100}
      UPDATE_BACKFILL_PAGES_PER_CYCLE: ${UPDATE_BACKFILL_PAGES_PER_CYCLE:-3}
      UPDATE_BACKFILL_CHANNELS_PER_CYCLE: ${UPDATE_BACKFILL_CHANNELS_PER_CYCLE:-1}
      UPDATE_LIST_SLEEP_MIN: ${UPDATE_LIST_SLEEP_MIN:-3}
      UPDATE_LIST_SLEEP_MAX: ${UPDATE_LIST_SLEEP_MAX:-7}
      UPDATE_MAX_COMMENT_SCRAPES: ${UPDATE_MAX_COMMENT_SCRAPES:-3}
      UPDATE_MAX_COMMENTS_PER_VIDEO: ${UPDATE_MAX_COMMENTS_PER_VIDEO:-50}
      UPDATE_MAX_ANALYZE_ATTEMPTS: ${UPDATE_MAX_ANALYZE_ATTEMPTS:-3}
      UPDATE_ANALYSIS_RECHECK_SECONDS: ${UPDATE_ANALYSIS_RECHECK_SECONDS:-86400}
      UPDATE_ANALYSIS_RETRY_BASE: ${UPDATE_ANALYSIS_RETRY_BASE:-1800}
      UPDATE_SCRAPE_SLEEP_MIN: ${UPDATE_SCRAPE_SLEEP_MIN:-20}
      UPDATE_SCRAPE_SLEEP_MAX: ${UPDATE_SCRAPE_SLEEP_MAX:-40}
      UPDATE_YOUTUBE_COOLDOWN_SECONDS: ${UPDATE_YOUTUBE_COOLDOWN_SECONDS:-21600}
      YTDLP_LIST_SLEEP_INTERVAL: ${YTDLP_LIST_SLEEP_INTERVAL:-1}
      YTDLP_LIST_MAX_SLEEP_INTERVAL: ${YTDLP_LIST_MAX_SLEEP_INTERVAL:-2}
      YTDLP_COMMENT_SLEEP_INTERVAL: ${YTDLP_COMMENT_SLEEP_INTERVAL:-2}
      YTDLP_COMMENT_MAX_SLEEP_INTERVAL: ${YTDLP_COMMENT_MAX_SLEEP_INTERVAL:-10}
      YTDLP_SOCKET_TIMEOUT_SECONDS: ${YTDLP_SOCKET_TIMEOUT_SECONDS:-30}
      YTDLP_RETRIES: ${YTDLP_RETRIES:-2}
      YTDLP_EXTRACTOR_RETRIES: ${YTDLP_EXTRACTOR_RETRIES:-2}
      YTDLP_OPERATION_TIMEOUT_SECONDS: ${YTDLP_OPERATION_TIMEOUT_SECONDS:-300}
      YTDLP_TERMINATE_GRACE_SECONDS: ${YTDLP_TERMINATE_GRACE_SECONDS:-5}
      UPDATER_SHUTDOWN_GRACE_SECONDS: ${UPDATER_SHUTDOWN_GRACE_SECONDS:-20}
      XDG_CACHE_HOME: /tmp/.cache
      # Comma-separated browser origins; leave empty if no frontend yet
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - vks
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: homelab/vtuber-karaoke-search-postgres:latest
    build:
      context: .
      dockerfile: db/Postgres.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vks_db}
      POSTGRES_USER: ${DB_USER:-vks_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - vks-pgdata:/var/lib/postgresql
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=16m,uid=999,gid=999,mode=3777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vks

  flyway:
    image: homelab/vtuber-karaoke-search-migrations:latest
    build:
      context: .
      dockerfile: db/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://db:5432/${DB_NAME:-vks_db}
      - -user=${DB_USER:-vks_db_user}
      - -password=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=5
      - migrate
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    networks:
      - vks

volumes:
  vks-pgdata:

networks:
  vks:
    ipam:
      config:
        - subnet: ${VKS_SUBNET:-172.30.0.0/24}
