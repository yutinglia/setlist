# Local / CI compose entrypoint.
# Prefer opening the repo in a Dev Container (see .devcontainer/).
#
# Postgres + migrations only:
#   docker compose -f .devcontainer/docker-compose.yml up -d db flyway
#
# Production-oriented API (uvicorn, not the IDE sleep container):
#   docker compose up --build data_updater
#
# Dev Container workspace (sleep infinity for the IDE):
#   docker compose -f .devcontainer/docker-compose.yml up --build app

name: vtuber-karaoke-search

include:
  - path: .devcontainer/docker-compose.yml

services:
  # Runs the FastAPI app + background updater. Dev Container `app` stays sleep infinity.
  data_updater:
    build:
      context: ./data_updater
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: prod
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vks_db
      DB_USER: vks_db_user
      DB_PASSWORD: vks_db_pwd
      DATABASE_URL: postgresql+asyncpg://vks_db_user:vks_db_pwd@db:5432/vks_db
      DATA_UPDATE_INTERVAL: "1800"
      # Comma-separated browser origins; leave empty if no frontend yet
      CORS_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - vks
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
