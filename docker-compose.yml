name: vtuber-karaoke-search

services:
  data_updater:
    build:
      context: ./data_updater
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: prod
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vks_db
      DB_USER: vks_db_user
      DB_PASSWORD: vks_db_pwd
      DATABASE_URL: postgresql+asyncpg://vks_db_user:vks_db_pwd@db:5432/vks_db
      DATA_UPDATE_INTERVAL: "1800"
      # Comma-separated browser origins; leave empty if no frontend yet
      CORS_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - vks
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vks_db
      POSTGRES_USER: vks_db_user
      POSTGRES_PASSWORD: vks_db_pwd
    volumes:
      - vks-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vks_db_user -d vks_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vks

  flyway:
    image: flyway/flyway:11-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://db:5432/vks_db
      - -user=vks_db_user
      - -password=vks_db_pwd
      - -connectRetries=5
      - migrate
    networks:
      - vks

volumes:
  vks-pgdata:

networks:
  vks:
