name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for credentials
        run: python scripts/check_secrets.py

      - name: Reject oversized source files
        run: python scripts/check_code_quality.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vks_db_user:vks_db_pwd@localhost:5432/vks_db

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start PostgreSQL and apply Flyway migrations
        working-directory: .
        run: |
          docker compose -f docker-compose.dev.yml up -d db
          docker compose -f docker-compose.dev.yml run --rm flyway

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Backend tests
        run: >-
          python -m pytest
          --cov
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-report=html:htmlcov

      - name: Publish backend coverage summary
        if: always() && hashFiles('backend/coverage.json') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text())["totals"]
          covered = totals["covered_lines"] + totals["covered_branches"]
          measured = totals["num_statements"] + totals["num_branches"]
          print("## Backend coverage")
          print()
          print("| Metric | Covered | Total | Coverage |")
          print("| --- | ---: | ---: | ---: |")
          print(
              f"| Statements + branches | {covered} | {measured} | "
              f"{totals['percent_covered']:.2f}% |"
          )
          PY

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
            backend/htmlcov
          if-no-files-found: warn
          retention-days: 14

      - name: Build production runtime image
        working-directory: .
        run: docker build -f backend/Dockerfile --target runtime -t vks-backend:ci .

      - name: Build production migrations image
        working-directory: .
        run: docker build -f db/Dockerfile -t vks-migrations:ci .

      - name: Build production PostgreSQL image
        working-directory: .
        run: docker build -f db/Postgres.Dockerfile -t vks-postgres:ci .

      - name: Stop test services
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.dev.yml down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify third-party notices
        run: |
          npm run generate:notices
          git diff --exit-code -- ../THIRD_PARTY_NOTICES.md

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:coverage

      - name: Publish frontend coverage summary
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs"

          const totals = JSON.parse(
            readFileSync("coverage/coverage-summary.json", "utf8"),
          ).total
          console.log("## Frontend coverage")
          console.log("")
          console.log("| Metric | Covered | Total | Coverage |")
          console.log("| --- | ---: | ---: | ---: |")
          for (const key of ["statements", "branches", "functions", "lines"]) {
            const metric = totals[key]
            const label = key[0].toUpperCase() + key.slice(1)
            console.log(
              `| ${label} | ${metric.covered} | ${metric.total} | ${metric.pct}% |`,
            )
          }
          NODE

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Frontend production build
        run: npm run build

      - name: Build production frontend image
        working-directory: .
        run: docker build -f frontend/Dockerfile -t vks-frontend:ci .
