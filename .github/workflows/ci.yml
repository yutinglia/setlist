name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: data_updater
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vks_db_user:vks_db_pwd@localhost:5432/vks_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            data_updater/requirements.txt
            data_updater/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start PostgreSQL and apply Flyway migrations
        working-directory: .
        run: |
          docker compose -f docker-compose.dev.yml up -d db
          docker compose -f docker-compose.dev.yml run --rm flyway

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Backend tests
        run: python -m pytest

      - name: Build production runtime image
        run: docker build --target runtime -t vks-data-updater:ci .

      - name: Stop test services
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.dev.yml down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend production build
        run: npm run build
