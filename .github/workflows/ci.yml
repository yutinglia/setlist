name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for credentials
        run: python scripts/check_secrets.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vks_db_user:vks_db_pwd@localhost:5432/vks_db

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start PostgreSQL and apply Flyway migrations
        working-directory: .
        run: |
          docker compose -f docker-compose.dev.yml up -d db
          docker compose -f docker-compose.dev.yml run --rm flyway

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Backend tests
        run: python -m pytest

      - name: Build production runtime image
        working-directory: .
        run: docker build -f backend/Dockerfile --target runtime -t vks-backend:ci .

      - name: Build production migrations image
        working-directory: .
        run: docker build -f db/Dockerfile -t vks-migrations:ci .

      - name: Build production PostgreSQL image
        working-directory: .
        run: docker build -f db/Postgres.Dockerfile -t vks-postgres:ci .

      - name: Stop test services
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.dev.yml down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify third-party notices
        run: |
          npm run generate:notices
          git diff --exit-code -- ../THIRD_PARTY_NOTICES.md

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Build production frontend image
        working-directory: .
        run: docker build -f frontend/Dockerfile -t vks-frontend:ci .
