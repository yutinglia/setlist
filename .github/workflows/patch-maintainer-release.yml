name: Patch maintainer release support

on:
  push:
    branches:
      - agent/allow-maintainer-release-pr

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'yutinglia/setlist' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Allow trusted maintainer release PRs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dependency-release.yml')
          text = path.read_text()
          old = '''                  .head.ref == $head and
                  .user.login == "github-actions[bot]"
'''
          new = '''                  .head.ref == $head and
                  (
                    .user.login == "github-actions[bot]" or
                    .user.login == "yutinglia"
                  )
'''
          if text.count(old) != 1:
              raise SystemExit('Expected release PR author condition exactly once')
          text = text.replace(old, new)
          text = text.replace(
              'echo "The untagged version was not created by the dependency release workflow."',
              'echo "The untagged version was not created by a trusted release workflow or maintainer."',
          )
          text = text.replace(
              'echo "::error::Automated release PR changed unexpected files."',
              'echo "::error::Release PR changed unexpected files."',
          )
          text = text.replace(
              'echo "::error::Automated release PR lacks independent approval."',
              'echo "::error::Release PR lacks independent approval."',
          )
          path.write_text(text)
          PY

          git diff --check
          git diff --exit-code -- . ':!.github/workflows/dependency-release.yml' ':!.github/workflows/patch-maintainer-release.yml'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dependency-release.yml
          git commit -m "ci: allow trusted maintainer release PRs"
          git push origin HEAD:agent/allow-maintainer-release-pr
