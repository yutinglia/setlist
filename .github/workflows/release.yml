name: Build release images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/yutinglia/setlist-frontend
  BACKEND_IMAGE: ghcr.io/yutinglia/setlist-backend
  MIGRATIONS_IMAGE: ghcr.io/yutinglia/setlist-migrations
  POSTGRES_IMAGE: ghcr.io/yutinglia/setlist-postgres

jobs:
  release:
    name: Build and publish
    if: github.repository == 'yutinglia/setlist'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must use MAJOR.MINOR.PATCH."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Releases require a semantic version tag."
            exit 1
          fi

          expected_tag="v${source_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION (${expected_tag})."
            exit 1
          fi

          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])'
          )"
          if [[ "$tagged_commit" != "$main_commit" ]]; then
            echo "::error::Release tag must point to the current protected main commit."
            exit 1
          fi

          echo "APP_VERSION=$source_version" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Verify successful coverage-gated CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          max_attempts=12

          for attempt in $(seq 1 "$max_attempts"); do
            successful_runs="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tagged_commit}&status=success&per_page=100" \
                --slurp
            )"

            if jq -e --arg sha "$tagged_commit" '
              [.[] | .workflow_runs[] |
                select(
                  .head_sha == $sha and
                  .conclusion == "success" and
                  (.event == "push" or .event == "workflow_dispatch")
                )
              ] |
              length > 0
            ' <<< "$successful_runs" > /dev/null; then
              echo "Found a successful coverage-gated CI run for ${tagged_commit}."
              exit 0
            fi

            if (( attempt < max_attempts )); then
              echo "CI run for ${tagged_commit} is not visible yet (attempt ${attempt}/${max_attempts}); retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "::error::Release commit lacks a successful coverage-gated CI run after ${max_attempts} attempts."
          echo "::error::Expected ci.yml to have a successful push or workflow_dispatch run for ${tagged_commit}."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            VITE_SOURCE_URL=https://github.com/yutinglia/setlist
            VITE_PUBLIC_SITE_URL=https://setlist.yutinglia.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish migrations
        id: migrations
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: db/Dockerfile
          push: true
          tags: |
            ${{ env.MIGRATIONS_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.MIGRATIONS_IMAGE }}:latest
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,scope=migrations,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish PostgreSQL
        id: postgres
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: db/Postgres.Dockerfile
          push: true
          tags: |
            ${{ env.POSTGRES_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.POSTGRES_IMAGE }}:latest
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest frontend image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Attest backend image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Attest migrations image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.MIGRATIONS_IMAGE }}
          subject-digest: ${{ steps.migrations.outputs.digest }}
          push-to-registry: true

      - name: Attest PostgreSQL image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.POSTGRES_IMAGE }}
          subject-digest: ${{ steps.postgres.outputs.digest }}
          push-to-registry: true

      - name: Verify image attestations
        if: github.event.repository.visibility == 'public'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          verify_image() {
            local image="$1"
            local digest="$2"

            gh attestation verify "oci://${image}@${digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          }

          verify_image "$FRONTEND_IMAGE" "${{ steps.frontend.outputs.digest }}"
          verify_image "$BACKEND_IMAGE" "${{ steps.backend.outputs.digest }}"
          verify_image "$MIGRATIONS_IMAGE" "${{ steps.migrations.outputs.digest }}"
          verify_image "$POSTGRES_IMAGE" "${{ steps.postgres.outputs.digest }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release ${IMAGE_TAG} already exists."
          else
            gh release create "$IMAGE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "Setlist ${IMAGE_TAG}"
          fi

      - name: Create deployment dispatch token
        id: deploy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_DISPATCH_APP_PRIVATE_KEY }}
          owner: yutinglia
          repositories: setlist-deploy
          permission-contents: write

      - name: Notify deployment control plane
        shell: bash
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          RELEASE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          gh api --method POST \
            repos/yutinglia/setlist-deploy/dispatches \
            -f event_type=setlist_release_published \
            -F "client_payload[release_tag]=$RELEASE_TAG"
