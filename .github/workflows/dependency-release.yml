name: Prepare dependency release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Internal continuation CI run ID
        required: true
        type: string
      expected_sha:
        description: Internal continuation main commit
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependency-release
  queue: max
  cancel-in-progress: false

jobs:
  dependency-release:
    name: Prepare or publish dependency release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >-
      github.repository == 'yutinglia/setlist' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'github-actions[bot]' &&
          github.triggering_actor == 'github-actions[bot]' &&
          github.run_attempt == '1' &&
          inputs.ci_run_id != '' &&
          inputs.expected_sha != ''
        )
      )

    steps:
      # Only the tested protected main branch is checked out. No pull-request
      # artifacts or caches are consumed by this privileged workflow.
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and wait for continuation CI
        if: github.event_name == 'workflow_dispatch'
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Continuation CI run id is invalid."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Continuation main commit is invalid."
            exit 1
          fi

          read_run() {
            gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID"
          }
          validate_run_identity() {
            jq -e \
              --arg expected_sha "$EXPECTED_SHA" '
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $expected_sha and
              .actor.login == "github-actions[bot]" and
              .triggering_actor.login == "github-actions[bot]" and
              .run_attempt == 1
            ' > /dev/null
          }

          run_json="$(read_run)"
          if ! validate_run_identity <<< "$run_json"; then
            echo "::error::Continuation does not reference the expected main CI run."
            exit 1
          fi

          gh run watch "$CI_RUN_ID" \
            --repo "$REPOSITORY" \
            --exit-status \
            --interval 10

          run_json="$(read_run)"
          if ! validate_run_identity <<< "$run_json" ||
             ! jq -e '
               .status == "completed" and .conclusion == "success"
             ' <<< "$run_json" > /dev/null; then
            echo "::error::The exact continuation CI run did not succeed."
            exit 1
          fi

      - name: Confirm the tested revision is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.expected_sha
                || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"

          if [[ "$local_sha" != "$TESTED_SHA" || "$remote_sha" != "$TESTED_SHA" ]]; then
            echo "main advanced after this CI run; the newer run will retry."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Inspect dependency and release state
        if: steps.current.outputs.current == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          write_output() {
            printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          write_output "mode=none"

          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error file=VERSION::VERSION must use MAJOR.MINOR.PATCH."
            exit 1
          fi

          package_version="$(node -p "require('./frontend/package.json').version")"
          lock_version="$(node -p "require('./frontend/package-lock.json').version")"
          lock_root_version="$(
            node -p "require('./frontend/package-lock.json').packages[''].version"
          )"
          if [[ "$package_version" != "$version" ||
                "$lock_version" != "$version" ||
                "$lock_root_version" != "$version" ]]; then
            echo "::error::Tracked application versions are not synchronized."
            exit 1
          fi

          release_tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            if ! git merge-base --is-ancestor "$release_tag" HEAD; then
              echo "::error::${release_tag} is not an ancestor of current main."
              exit 1
            fi

            pending_prs=()
            while IFS= read -r commit_sha; do
              [[ -z "$commit_sha" ]] && continue

              associated_prs="$(
                gh api "repos/$REPOSITORY/commits/$commit_sha/pulls"
              )"
              while IFS=$'\t' read -r pr_number head_ref; do
                [[ -z "$pr_number" ]] && continue

                commits_json="$(
                  gh api --paginate \
                    "repos/$REPOSITORY/pulls/$pr_number/commits?per_page=100" \
                    --slurp
                )"
                if ! jq -e '
                  [.[][]] as $commits |
                  ($commits | length) > 0 and
                  (
                    all($commits[];
                      .author.login == "dependabot[bot]" and
                      .commit.verification.verified == true
                    ) or
                    (
                      ($commits | length) > 1 and
                      all($commits[0:-1][];
                        .author.login == "dependabot[bot]" and
                        .commit.verification.verified == true
                      ) and
                      ($commits[-1].author.login == "github-actions[bot]") and
                      ($commits[-1].committer.login == "web-flow") and
                      ($commits[-1].commit.verification.verified == true) and
                      (($commits[-1].commit.message | split("\n")[0]) ==
                        "docs: regenerate third-party notices") and
                      (($commits[-1].parents | length) == 1) and
                      ($commits[-1].parents[0].sha == $commits[-2].sha)
                    )
                  )
                ' <<< "$commits_json" > /dev/null; then
                  echo "Skipping PR #${pr_number}: commit provenance is not trusted."
                  continue
                fi

                notice_sha="$(
                  jq -r '
                    [.[][]][-1] |
                    if .author.login == "github-actions[bot]" then .sha else "" end
                  ' <<< "$commits_json"
                )"
                if [[ -n "$notice_sha" ]]; then
                  notice_json="$(
                    gh api "repos/$REPOSITORY/commits/$notice_sha"
                  )"
                  if ! jq -e '
                    (.files | length) == 1 and
                    .files[0].filename == "THIRD_PARTY_NOTICES.md" and
                    .files[0].status == "modified" and
                    (.files[0].previous_filename // null) == null
                  ' <<< "$notice_json" > /dev/null; then
                    echo "Skipping PR #${pr_number}: generated notice commit changed unexpected files."
                    continue
                  fi
                fi

                pending_prs+=("#${pr_number}")
                echo "Dependency release includes PR #${pr_number} (${head_ref})."
              done < <(
                jq -r \
                  --arg sha "$commit_sha" \
                  --arg repository "$REPOSITORY" '
                  .[] |
                  select(
                    .merged_at != null and
                    .merge_commit_sha == $sha and
                    .base.ref == "main" and
                    .head.repo.full_name == $repository and
                    .user.login == "dependabot[bot]" and
                    (.head.ref | startswith("dependabot/"))
                  ) |
                  [.number, .head.ref] |
                  @tsv
                ' <<< "$associated_prs"
              )
            done < <(git rev-list --reverse "${release_tag}..HEAD")

            if (( ${#pending_prs[@]} > 0 )); then
              joined="$(IFS=,; echo "${pending_prs[*]}")"
              write_output "mode=prepare"
              write_output "pending_prs=$joined"
            else
              echo "No verified merged Dependabot PRs need a release."
            fi
            exit 0
          fi

          version_commit="$(git log -1 --format=%H -- VERSION)"
          if [[ "$version_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "The untagged version was not introduced by the tested current main commit."
            exit 0
          fi
          release_prs="$(
            gh api "repos/$REPOSITORY/commits/$version_commit/pulls"
          )"
          matching_release_prs="$(
            jq \
              --arg sha "$version_commit" \
              --arg head "release/$release_tag" \
              --arg repository "$REPOSITORY" '
              [
                .[] |
                select(
                  .merged_at != null and
                  .merge_commit_sha == $sha and
                  .base.ref == "main" and
                  .head.ref == $head and
                  .head.repo.full_name == $repository and
                  .user.login == "github-actions[bot]"
                )
              ]
            ' <<< "$release_prs"
          )"
          if [[ "$(jq 'length' <<< "$matching_release_prs")" != "1" ]]; then
            echo "The untagged version was not created by the dependency release workflow."
            exit 0
          fi

          release_pr_number="$(jq -r '.[0].number' <<< "$matching_release_prs")"
          files_json="$(
            gh api --paginate \
              "repos/$REPOSITORY/pulls/$release_pr_number/files?per_page=100" \
              --slurp
          )"
          if ! jq -e '
            ([.[][] | .filename] | sort) ==
            ([
              "VERSION",
              "frontend/package-lock.json",
              "frontend/package.json"
            ] | sort)
          ' <<< "$files_json" > /dev/null; then
            echo "::error::Automated release PR changed unexpected files."
            exit 1
          fi

          write_output "mode=publish"
          write_output "release_tag=$release_tag"
          write_output "release_pr=$release_pr_number"

      - name: Create or refresh patch release PR
        if: steps.state.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_PRS: ${{ steps.state.outputs.pending_prs }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          open_prs="$(
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open \
              -f base=main \
              -f per_page=100
          )"
          release_prs="$(
            jq --arg repository "$REPOSITORY" '
              [
                .[] |
                select(
                  (.head.ref | startswith("release/v")) and
                  .head.repo.full_name == $repository
                )
              ]
            ' <<< "$open_prs"
          )"
          release_count="$(jq 'length' <<< "$release_prs")"
          if (( release_count > 1 )); then
            echo "::error::More than one release PR is open."
            exit 1
          fi

          if (( release_count == 1 )); then
            release_author="$(jq -r '.[0].user.login' <<< "$release_prs")"
            release_branch="$(jq -r '.[0].head.ref' <<< "$release_prs")"
            pr_url="$(jq -r '.[0].html_url' <<< "$release_prs")"

            if [[ "$release_author" != "github-actions[bot]" ]]; then
              echo "A maintainer-managed release PR is already open: $pr_url"
              exit 0
            fi

            git fetch origin \
              "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            git switch --force-create "$release_branch" "origin/$release_branch"
            git rebase origin/main
            git push --force-with-lease origin "$release_branch"
          else
            node scripts/bump-version.mjs patch
            release_branch="$(git branch --show-current)"
            git push --set-upstream origin "$release_branch"

            release_version="$(tr -d '\r\n' < VERSION)"
            release_tag="v${release_version}"
            pr_body="$(
              cat <<EOF
          ## Summary

          Automated patch release for merged Dependabot updates: ${PENDING_PRS}.

          This PR only synchronizes \`VERSION\`, \`frontend/package.json\`, and
          \`frontend/package-lock.json\`. It still requires the protected
          branch checks. After merge, the tested \`main\` revision is tagged
          and the existing release image workflow is dispatched automatically.
          EOF
            )"
            pr_url="$(
              gh pr create \
                --repo "$REPOSITORY" \
                --base main \
                --head "$release_branch" \
                --title "Release ${release_tag} for dependency updates" \
                --body "$pr_body"
            )"
          fi

          release_version="$(tr -d '\r\n' < VERSION)"
          release_tag="v${release_version}"
          if [[ "$release_branch" != "release/$release_tag" ]]; then
            echo "::error::Release branch and tracked version do not agree."
            exit 1
          fi

          package_version="$(node -p "require('./frontend/package.json').version")"
          lock_version="$(node -p "require('./frontend/package-lock.json').version")"
          lock_root_version="$(
            node -p "require('./frontend/package-lock.json').packages[''].version"
          )"
          if [[ "$package_version" != "$release_version" ||
                "$lock_version" != "$release_version" ||
                "$lock_root_version" != "$release_version" ]]; then
            echo "::error::Release versions are not synchronized."
            exit 1
          fi

          mapfile -t changed_files < <(
            git diff --name-only origin/main...HEAD | sort
          )
          expected_files=(
            VERSION
            frontend/package-lock.json
            frontend/package.json
          )
          mapfile -t expected_files < <(printf '%s\n' "${expected_files[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed_files[@]}")" != \
                "$(printf '%s\n' "${expected_files[@]}")" ]]; then
            echo "::error::Release PR contains unexpected file changes."
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          dispatch_ci() {
            local ref="$1"
            local run_output run_url

            run_output="$(
              gh workflow run ci.yml \
                --repo "$REPOSITORY" \
                --ref "$ref"
            )"
            run_url="$(tail -n 1 <<< "$run_output" | tr -d '\r')"
            if [[ ! "$run_url" =~ /actions/runs/([1-9][0-9]*)$ ]]; then
              echo "::error::Could not identify the dispatched CI run." >&2
              exit 1
            fi
            printf '%s\n' "${BASH_REMATCH[1]}"
          }

          read_run() {
            gh api "repos/$REPOSITORY/actions/runs/$1"
          }

          validate_ci_identity() {
            local run_id="$1"
            local expected_branch="$2"
            local expected_sha="$3"
            local run_json

            run_json="$(read_run "$run_id")"
            jq -e \
              --arg expected_branch "$expected_branch" \
              --arg expected_sha "$expected_sha" '
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .event == "workflow_dispatch" and
              .head_branch == $expected_branch and
              .head_sha == $expected_sha and
              .actor.login == "github-actions[bot]" and
              .triggering_actor.login == "github-actions[bot]" and
              .run_attempt == 1
            ' <<< "$run_json" > /dev/null
          }

          release_ci_run_id="$(dispatch_ci "$release_branch")"
          if ! validate_ci_identity \
            "$release_ci_run_id" "$release_branch" "$release_sha"; then
            echo "::error::The dispatched release CI identity is not trusted."
            exit 1
          fi
          gh run watch "$release_ci_run_id" \
            --repo "$REPOSITORY" \
            --exit-status \
            --interval 10
          release_ci_json="$(read_run "$release_ci_run_id")"
          if ! validate_ci_identity \
               "$release_ci_run_id" "$release_branch" "$release_sha" ||
             ! jq -e '
               .status == "completed" and .conclusion == "success"
             ' <<< "$release_ci_json" > /dev/null; then
            echo "::error::The exact release CI run did not succeed."
            exit 1
          fi

          pr_number="${pr_url##*/}"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Release PR number is invalid."
            exit 1
          fi
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          if ! jq -e \
            --arg expected_branch "$release_branch" \
            --arg expected_sha "$release_sha" \
            --arg repository "$REPOSITORY" '
            .state == "open" and
            .draft == false and
            .user.login == "github-actions[bot]" and
            .base.ref == "main" and
            .head.ref == $expected_branch and
            .head.sha == $expected_sha and
            .head.repo.full_name == $repository
          ' <<< "$pr_json" > /dev/null; then
            echo "::error::Release PR no longer matches the prepared revision."
            exit 1
          fi

          files_json="$(
            gh api --paginate \
              "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" \
              --slurp
          )"
          if ! jq -e '
            ([.[][] | .filename] | sort) ==
            ([
              "VERSION",
              "frontend/package-lock.json",
              "frontend/package.json"
            ] | sort) and
            all(.[][];
              .status == "modified" and
              (.previous_filename // null) == null
            )
          ' <<< "$files_json" > /dev/null; then
            echo "::error::Release PR changed unexpected files."
            exit 1
          fi

          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
          current_main_sha="$(git rev-parse origin/main)"
          remote_release_sha="$(git rev-parse "origin/$release_branch")"
          release_parent_sha="$(git rev-parse "${release_sha}^")"
          release_commit_count="$(git rev-list --count "origin/main..$release_sha")"
          release_subject="$(git log -1 --format=%s "$release_sha")"
          if [[ "$remote_release_sha" != "$release_sha" ||
                "$release_parent_sha" != "$current_main_sha" ||
                "$release_commit_count" != "1" ||
                "$release_subject" != "chore(release): $release_tag" ]]; then
            echo "::error::Release branch history is not the expected single version commit."
            exit 1
          fi

          gh pr merge "$pr_number" \
            --repo "$REPOSITORY" \
            --squash \
            --match-head-commit "$release_sha"

          merge_json=""
          for _ in {1..30}; do
            merge_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
            if [[ "$(jq -r '.merged_at // empty' <<< "$merge_json")" != "" ]]; then
              break
            fi
            if [[ "$(jq -r .state <<< "$merge_json")" == "closed" ]]; then
              echo "::error::Release PR closed without merging."
              exit 1
            fi
            sleep 2
          done

          merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$merge_json")"
          if [[ ! "$merge_sha" =~ ^[0-9a-f]{40}$ ||
                "$(jq -r '.merged_at // empty' <<< "$merge_json")" == "" ]]; then
            echo "::error::Release PR did not merge within the bounded wait."
            exit 1
          fi

          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main"
          remote_main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          if [[ "$(git rev-parse origin/main)" != "$merge_sha" ||
                "$remote_main_sha" != "$merge_sha" ]]; then
            echo "::error::main advanced before the merged release could be tested."
            exit 1
          fi

          main_ci_run_id="$(dispatch_ci main)"
          if ! validate_ci_identity "$main_ci_run_id" main "$merge_sha"; then
            echo "::error::The dispatched main CI identity is not trusted."
            exit 1
          fi

          continuation_output="$(
            gh workflow run dependency-release.yml \
              --repo "$REPOSITORY" \
              --ref main \
              -f "ci_run_id=$main_ci_run_id" \
              -f "expected_sha=$merge_sha"
          )"
          continuation_url="$(
            tail -n 1 <<< "$continuation_output" | tr -d '\r'
          )"
          if [[ ! "$continuation_url" =~ /actions/runs/([1-9][0-9]*)$ ]]; then
            echo "::error::Could not identify the dependency release continuation."
            exit 1
          fi
          continuation_run_id="${BASH_REMATCH[1]}"
          continuation_json="$(read_run "$continuation_run_id")"
          if ! jq -e \
            --arg expected_sha "$merge_sha" '
            (.path | split("@")[0]) ==
              ".github/workflows/dependency-release.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $expected_sha and
            .actor.login == "github-actions[bot]" and
            .triggering_actor.login == "github-actions[bot]" and
            .run_attempt == 1
          ' <<< "$continuation_json" > /dev/null; then
            echo "::error::Dependency release continuation identity is not trusted."
            exit 1
          fi

          echo "Merged $pr_url at $merge_sha; continuation run $continuation_run_id will wait for exact main CI $main_ci_run_id."

      - name: Tag and dispatch the tested dependency release
        if: steps.state.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.state.outputs.release_pr }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG already exists."
            exit 0
          fi

          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          release_merge_sha="$(
            gh api "repos/$REPOSITORY/pulls/$RELEASE_PR" --jq .merge_commit_sha
          )"
          if [[ "$remote_sha" != "$local_sha" ||
                "$release_merge_sha" != "$local_sha" ]]; then
            echo "main or the release PR changed before tagging; a newer run must retry."
            exit 0
          fi

          node scripts/bump-version.mjs tag
          git push origin "refs/tags/$RELEASE_TAG"
          gh workflow run release.yml --repo "$REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched $RELEASE_TAG from tested release PR #$RELEASE_PR."
