name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Approve eligible updates and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'yutinglia/setlist' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.actor.login == 'dependabot[bot]'
        ) ||
        (
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.actor.login == 'github-actions[bot]'
        )
      )

    steps:
      # This privileged workflow never checks out PR code, restores PR caches,
      # or downloads artifacts produced by the unprivileged CI workflow.
      - name: Verify Dependabot PR and evaluate update policy
        id: policy
        env:
          CI_EVENT: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "eligible=false" >> "$GITHUB_OUTPUT"
          echo "requires_external_approval=false" >> "$GITHUB_OUTPUT"

          case "$HEAD_BRANCH" in
            dependabot/*)
              ;;
            *)
              echo "The successful CI run was not for a Dependabot branch."
              exit 0
              ;;
          esac

          pr_number="$PR_NUMBER"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            owner="${REPOSITORY%%/*}"
            matches="$(
              gh api --method GET "repos/$REPOSITORY/pulls" \
                -f state=open \
                -f base=main \
                -f head="$owner:$HEAD_BRANCH"
            )"

            if [[ "$(jq 'length' <<< "$matches")" != "1" ]]; then
              echo "Could not resolve exactly one open PR for $HEAD_BRANCH."
              exit 0
            fi

            pr_number="$(jq -r '.[0].number' <<< "$matches")"
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          author="$(jq -r '.user.login' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          pr_state="$(jq -r '.state' <<< "$pr_json")"
          pr_url="$(jq -r '.html_url' <<< "$pr_json")"

          if [[ "$author" != "dependabot[bot]" ||
                "$base_ref" != "main" ||
                "$draft" != "false" ||
                "$head_ref" != "$HEAD_BRANCH" ||
                "$head_repo" != "$REPOSITORY" ||
                "$head_sha" != "$TESTED_SHA" ||
                "$pr_state" != "open" ]]; then
            echo "The current PR does not match the tested Dependabot revision."
            exit 0
          fi

          commits_file="$RUNNER_TEMP/dependabot-pr-commits.json"
          gh api --paginate \
            "repos/$REPOSITORY/pulls/$pr_number/commits?per_page=100" \
            --slurp > "$commits_file"

          read -r notice_sha notice_parent_sha < <(
            python - "$commits_file" <<'PY'
          import json
          from pathlib import Path
          import sys

          pages = json.loads(Path(sys.argv[1]).read_text())
          commits = [commit for page in pages for commit in page]
          if not commits:
              raise SystemExit("The Dependabot PR has no commits.")

          notice_index = None
          for index, commit in enumerate(commits):
              author = (commit.get("author") or {}).get("login")
              committer = (commit.get("committer") or {}).get("login")
              verification = commit.get("commit", {}).get("verification", {})
              message = commit.get("commit", {}).get("message", "").splitlines()[0]

              if author == "dependabot[bot]" and verification.get("verified") is True:
                  continue

              if (
                  author == "github-actions[bot]"
                  and committer == "github-actions[bot]"
                  and message == "docs: regenerate third-party notices"
              ):
                  if notice_index is not None:
                      raise SystemExit("More than one generated notice commit exists.")
                  notice_index = index
                  continue

              raise SystemExit(
                  f"Untrusted PR commit {commit.get('sha')}: "
                  f"author={author!r}, committer={committer!r}, message={message!r}."
              )

          if notice_index is None:
              print("- -")
              raise SystemExit(0)

          if notice_index != len(commits) - 1 or notice_index == 0:
              raise SystemExit("The generated notice commit must be the final commit.")

          notice = commits[notice_index]
          previous = commits[notice_index - 1]
          parents = notice.get("parents", [])
          if len(parents) != 1 or parents[0].get("sha") != previous.get("sha"):
              raise SystemExit("The generated notice commit is not a linear child.")

          print(notice["sha"], previous["sha"])
          PY
          )

          if [[ "$notice_sha" != "-" ]]; then
            if [[ "$CI_EVENT" != "workflow_dispatch" ||
                  "$notice_sha" != "$TESTED_SHA" ]]; then
              echo "A generated notice commit must be tested by the dispatched CI run."
              exit 0
            fi

            case "$head_ref" in
              dependabot/npm_and_yarn/frontend/*)
                ;;
              *)
                echo "Generated notices are only accepted for frontend npm updates."
                exit 0
                ;;
            esac

            notice_json="$(gh api "repos/$REPOSITORY/commits/$notice_sha")"
            if ! jq -e --arg parent "$notice_parent_sha" '
              .author.login == "github-actions[bot]" and
              .committer.login == "github-actions[bot]" and
              (.commit.message | split("\n")[0]) == "docs: regenerate third-party notices" and
              (.parents | length) == 1 and
              .parents[0].sha == $parent and
              (.files | length) == 1 and
              .files[0].filename == "THIRD_PARTY_NOTICES.md" and
              .files[0].status == "modified" and
              (.files[0].previous_filename // null) == null
            ' <<< "$notice_json" > /dev/null; then
              echo "The generated notice commit changed unexpected content."
              exit 0
            fi

            files_json="$(
              gh api --paginate \
                "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" \
                --slurp
            )"
            if ! jq -e '
              [.[][]] as $files |
              ($files | length) >= 2 and
              ($files | length) <= 3 and
              all($files[];
                (
                  .filename == "frontend/package.json" or
                  .filename == "frontend/package-lock.json" or
                  .filename == "THIRD_PARTY_NOTICES.md"
                ) and
                .status == "modified" and
                (.previous_filename // null) == null
              ) and
              any($files[]; .filename == "frontend/package-lock.json") and
              any($files[]; .filename == "THIRD_PARTY_NOTICES.md")
            ' <<< "$files_json" > /dev/null; then
              echo "The notice-bearing PR contains unexpected files."
              exit 0
            fi

            # The notice workflow and this workflow both use github-actions[bot].
            # It therefore cannot satisfy a rule requiring approval from someone
            # other than the most recent pusher. Enable auto-merge, but leave the
            # independent approval to a repository collaborator.
            echo "requires_external_approval=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CI_EVENT" != "pull_request" ]]; then
            echo "A dispatched CI run without a generated notice commit is ineligible."
            exit 0
          fi

          case "$head_ref" in
            dependabot/*/automerge-minor-patch*)
              reason="grouped minor or patch update"
              ;;
            dependabot/*/automerge-security*)
              reason="grouped security update"
              ;;
            *)
              echo "Dependabot policy: manual review required."
              exit 0
              ;;
          esac

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Dependabot policy: $reason."

      - name: Approve eligible update
        if: >-
          steps.policy.outputs.eligible == 'true' &&
          steps.policy.outputs.requires_external_approval != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.policy.outputs.pr_url }}
        run: |
          review_decision="$(
            gh pr view "$PR_URL" --json reviewDecision --jq .reviewDecision
          )"
          if [[ "$review_decision" == "APPROVED" ]]; then
            echo "Pull request is already approved."
          else
            gh pr review --approve "$PR_URL"
          fi

      - name: Enable squash auto-merge for eligible update
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.policy.outputs.pr_url }}
        run: |
          auto_merge_enabled="$(
            gh pr view "$PR_URL" --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"
          if [[ "$auto_merge_enabled" == "true" ]]; then
            echo "Auto-merge is already enabled."
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
