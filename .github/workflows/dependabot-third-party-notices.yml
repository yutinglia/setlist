name: Dependabot third-party notices

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-third-party-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/frontend/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validate the Dependabot change set
        env:
          API_URL: ${{ github.api_url }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_url = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          changed_files = int(os.environ["CHANGED_FILES"])
          token = os.environ["GH_TOKEN"]

          allowed = {
              "frontend/package.json",
              "frontend/package-lock.json",
              "THIRD_PARTY_NOTICES.md",
          }

          if changed_files > len(allowed):
              raise SystemExit(
                  f"Refusing PR with {changed_files} changed files; expected at most {len(allowed)}."
              )

          request = urllib.request.Request(
              f"{api_url}/repos/{repository}/pulls/{pr_number}/files?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              files = json.load(response)

          names = {entry["filename"] for entry in files}
          if len(files) != changed_files:
              raise SystemExit(
                  "Could not validate the complete PR file list; refusing to continue."
              )

          unexpected = sorted(names - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {unexpected}")

          if "frontend/package-lock.json" not in names:
              raise SystemExit("The PR does not change frontend/package-lock.json.")

          print("Validated changed files:")
          for name in sorted(names):
              print(f"- {name}")
          PY

      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the exact Dependabot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: worktree
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: worktree/frontend/package-lock.json

      - name: Install dependencies without lifecycle scripts
        working-directory: worktree/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate notices with the trusted base script
        env:
          NOTICE_RUNNER: ${{ runner.temp }}/setlist-notices
        run: |
          rm -rf "$NOTICE_RUNNER"
          mkdir -p "$NOTICE_RUNNER/scripts"
          cp \
            trusted/scripts/generate-frontend-third-party-notices.mjs \
            "$NOTICE_RUNNER/scripts/generate-frontend-third-party-notices.mjs"
          ln -s "$GITHUB_WORKSPACE/worktree/frontend" "$NOTICE_RUNNER/frontend"
          node "$NOTICE_RUNNER/scripts/generate-frontend-third-party-notices.mjs"
          mv "$NOTICE_RUNNER/THIRD_PARTY_NOTICES.md" worktree/THIRD_PARTY_NOTICES.md

      - name: Commit the generated notice and start CI
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          head_ref = os.environ["HEAD_REF"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          worktree = Path("worktree")
          notice_path = worktree / "THIRD_PARTY_NOTICES.md"

          diff = subprocess.run(
              ["git", "diff", "--exit-code", "--", "THIRD_PARTY_NOTICES.md"],
              cwd=worktree,
              check=False,
          )
          if diff.returncode == 0:
              print("THIRD_PARTY_NOTICES.md is already current.")
              raise SystemExit(0)
          if diff.returncode != 1:
              raise SystemExit("git diff failed unexpectedly.")

          status = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=no"],
              cwd=worktree,
              text=True,
          ).splitlines()
          if status != [" M THIRD_PARTY_NOTICES.md"]:
              raise SystemExit(f"Unexpected worktree changes: {status}")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None
              request_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode()
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"{api_url}/repos/{repository}{path}",
                  data=data,
                  headers=request_headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors="replace")
                  raise SystemExit(
                      f"GitHub API {method} {path} failed: {error.code} {detail}"
                  ) from error

          encoded_ref = urllib.parse.quote(head_ref, safe="/")
          current_ref = request("GET", f"/git/ref/heads/{encoded_ref}")
          if current_ref["object"]["sha"] != head_sha:
              raise SystemExit(
                  "The Dependabot branch moved after validation; refusing a stale write."
              )

          original_commit = request("GET", f"/git/commits/{head_sha}")
          notice_blob = request(
              "POST",
              "/git/blobs",
              {
                  "content": base64.b64encode(notice_path.read_bytes()).decode(),
                  "encoding": "base64",
              },
          )
          new_tree = request(
              "POST",
              "/git/trees",
              {
                  "base_tree": original_commit["tree"]["sha"],
                  "tree": [
                      {
                          "path": "THIRD_PARTY_NOTICES.md",
                          "mode": "100644",
                          "type": "blob",
                          "sha": notice_blob["sha"],
                      }
                  ],
              },
          )
          new_commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "docs: regenerate third-party notices",
                  "tree": new_tree["sha"],
                  "parents": [head_sha],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{encoded_ref}",
              {"sha": new_commit["sha"], "force": False},
          )

          request(
              "POST",
              "/actions/workflows/ci.yml/dispatches",
              {"ref": head_ref},
          )
          print(f"Updated notices in commit {new_commit['sha']} and dispatched CI.")
          PY